name: Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package -o baseline-vscode.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: baseline-vscode.vsix
          retention-days: 7

  publish-vscode:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Publishing to VS Code Marketplace..."
            if npx @vscode/vsce publish --packagePath baseline-vscode.vsix --skip-duplicate; then
              echo "Successfully published to VS Code Marketplace."
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              wait_time=$((i * 30))
              echo "Attempt $i failed. Retrying in ${wait_time}s..."
              sleep $wait_time
            fi
          done
          echo "Failed to publish to VS Code Marketplace after 3 attempts."
          exit 1

  publish-openvsx:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Publishing to Open VSX..."
            if npx ovsx publish baseline-vscode.vsix --skip-duplicate; then
              echo "Successfully published to Open VSX."
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              wait_time=$((i * 30))
              echo "Attempt $i failed. Retrying in ${wait_time}s..."
              sleep $wait_time
            fi
          done
          echo "Failed to publish to Open VSX after 3 attempts."
          exit 1
